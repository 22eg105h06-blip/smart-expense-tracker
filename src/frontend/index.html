<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
        }

        .card h2 {
            margin-bottom: 0;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        form input,
        form button {
            padding: 10px;
            margin: 5px;
        }

        form input {
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn {
            background: #333;
            color: white;
        }

        .delete {
            background: #ffdddd;
        }

        .filter {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        select {
            padding: 8px;
            margin-left: 10px;
        }

        .chart-container {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .table-container {
            overflow-x: auto;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>💰 Smart Expense Tracker</h1>


    <!-- Summary Cards -->

    <div class="cards">

        <div class="card">

            <h3>Total Expenses</h3>

            <h2 id="total">₹0</h2>

        </div>


        <div class="card">

            <h3>Number of Expenses</h3>

            <h2 id="count">0</h2>

        </div>

    </div>


    <!-- Add Expense Form -->

    <form id="expenseForm">

        <h2>Add Expense</h2>

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            min="0.01"
            step="0.01"
            required
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
            required
        >

        <input
            type="text"
            id="title"
            placeholder="Title"
            required
        >

        <input
            type="date"
            id="date"
            required
        >

        <button
            type="submit"
            class="add-btn">
            Add Expense
        </button>

    </form>


    <!-- Category Chart -->

    <div class="chart-container">

        <h2>Spending by Category</h2>

        <canvas id="categoryChart"></canvas>

    </div>


    <!-- Category Filter -->

    <div class="filter">

        <label for="categoryFilter">
            <strong>Filter by Category:</strong>
        </label>

        <select
            id="categoryFilter"
            onchange="filterExpenses()">

            <option value="">
                All Categories
            </option>

            <option value="Food">
                Food
            </option>

            <option value="Travel">
                Travel
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Bills">
                Bills
            </option>

            <option value="Other">
                Other
            </option>

        </select>

    </div>


    <!-- Expenses Table -->

    <h2>Expenses</h2>

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Amount</th>

                    <th>Category</th>

                    <th>Title</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="expenseTable">

            </tbody>

        </table>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";

let categoryChart = null;


// ----------------------------------------
// LOAD EXPENSES
// ----------------------------------------

async function loadExpenses() {

    try {

        const response =
            await fetch(`${API_URL}/expenses`);

        if (!response.ok) {
            throw new Error("Unable to load expenses");
        }

        const expenses =
            await response.json();

        displayExpenses(expenses);

        await loadCategoryChart();

    } catch (error) {

        console.error(error);

    }

}


// ----------------------------------------
// DISPLAY EXPENSES
// ----------------------------------------

function displayExpenses(expenses) {

    const table =
        document.getElementById("expenseTable");

    table.innerHTML = "";

    let total = 0;


    expenses.forEach(expense => {

        total += Number(expense.amount);


        const row = `

            <tr>

                <td>
                    ${expense.id}
                </td>

                <td>
                    ₹${expense.amount}
                </td>

                <td>
                    ${expense.category}
                </td>

                <td>
                    ${expense.title}
                </td>

                <td>
                    ${expense.date}
                </td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteExpense(${expense.id})">

                        Delete

                    </button>

                </td>

            </tr>

        `;


        table.innerHTML += row;

    });


    document.getElementById("total")
        .innerText = "₹" + total;


    document.getElementById("count")
        .innerText = expenses.length;

}


// ----------------------------------------
// ADD EXPENSE
// ----------------------------------------

document
    .getElementById("expenseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const expense = {

                amount:
                    parseFloat(
                        document
                            .getElementById("amount")
                            .value
                    ),

                category:
                    document
                        .getElementById("category")
                        .value
                        .trim(),

                title:
                    document
                        .getElementById("title")
                        .value
                        .trim(),

                date:
                    document
                        .getElementById("date")
                        .value

            };


            try {

                const response =
                    await fetch(
                        `${API_URL}/expenses`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(expense)

                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.json();

                    console.error(error);

                    alert(
                        "Error adding expense!"
                    );

                    return;

                }


                alert(
                    "Expense added successfully!"
                );


                document
                    .getElementById("expenseForm")
                    .reset();


                await loadExpenses();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Could not connect to the API."
                );

            }

        }
    );


// ----------------------------------------
// DELETE EXPENSE
// ----------------------------------------

async function deleteExpense(id) {

    try {

        const response =
            await fetch(
                `${API_URL}/expenses/${id}`,
                {
                    method: "DELETE"
                }
            );


        if (!response.ok) {

            alert(
                "Error deleting expense!"
            );

            return;

        }


        alert(
            "Expense deleted successfully!"
        );


        await loadExpenses();

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not connect to the API."
        );

    }

}


// ----------------------------------------
// FILTER EXPENSES
// ----------------------------------------

async function filterExpenses() {

    const category =
        document
            .getElementById("categoryFilter")
            .value;


    let url =
        `${API_URL}/expenses`;


    if (category) {

        url +=
            `?category=${encodeURIComponent(category)}`;

    }


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Unable to filter expenses"
            );

        }


        const expenses =
            await response.json();


        displayExpenses(expenses);

    }

    catch (error) {

        console.error(error);

    }

}


// ----------------------------------------
// CATEGORY CHART
// ----------------------------------------

async function loadCategoryChart() {

    try {

        const response =
            await fetch(
                `${API_URL}/summary`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load summary"
            );

        }


        const data =
            await response.json();


        const categories =
            Object.keys(
                data.by_category
            );


        const amounts =
            Object.values(
                data.by_category
            );


        const canvas =
            document.getElementById(
                "categoryChart"
            );


        if (!canvas) {
            return;
        }


        const ctx =
            canvas.getContext("2d");


        if (categoryChart) {

            categoryChart.destroy();

        }


        categoryChart =
            new Chart(
                ctx,
                {

                    type: "bar",

                    data: {

                        labels: categories,

                        datasets: [

                            {

                                label:
                                    "Amount Spent",

                                data:
                                    amounts

                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        scales: {

                            y: {

                                beginAtZero: true

                            }

                        }

                    }

                }
            );

    }

    catch (error) {

        console.error(error);

    }

}


// ----------------------------------------
// LOAD DATA WHEN PAGE OPENS
// ----------------------------------------

loadExpenses();

</script>

</body>

</html>
